name: 오늘의 잔별 인스타 게시

on:
  schedule:
    # 매일 한국시간 오후 9시 (UTC 12:00) — 밤에 사람들이 가장 많이 봅니다
    - cron: '0 12 * * *'
  workflow_dispatch: # 손으로도 돌려볼 수 있게

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - name: 게시
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
        run: node scripts/daily-instagram.mjs

      # 실패하면 조용히 넘어가지 않도록 — 이슈로 남깁니다
      - name: 실패 알림
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `인스타 자동 게시 실패 — ${new Date().toISOString().slice(0,10)}`,
              body: `실행 기록: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            })
