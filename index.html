<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- ================================================================
         공유 미리보기 (OG) — janbyeol.com 기준으로 박혀 있습니다.
         카카오톡·문자 스크래퍼는 자바스크립트를 실행하지 않고,
         상대 경로(/og-image.png)도 읽지 못합니다. 그래서 이 태그들은
         React가 아니라 이 정적 파일에, https:// 전체 주소로 있어야 합니다.
         ================================================================ -->

    <title>잔별 — 사소한 하루가 별이 되어 떠오르는 곳</title>
    <meta
      name="description"
      content="별거 아닌 줄 알았던 당신의 오늘이, 이곳에선 누군가의 밤을 비추는 잔별이 됩니다."
    />
    <link rel="canonical" href="https://janbyeol.com/" />
    <meta name="theme-color" content="#04050a" />

    <!-- Open Graph — 카카오톡 · 문자(iMessage) · 페이스북 · 슬랙 · 디스코드 -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="잔별" />
    <meta property="og:locale" content="ko_KR" />
    <meta property="og:url" content="https://janbyeol.com/" />
    <meta property="og:title" content="잔별 — 사소한 하루가 별이 되어 떠오르는 곳" />
    <meta
      property="og:description"
      content="별거 아닌 줄 알았던 당신의 오늘이, 이곳에선 누군가의 밤을 비추는 잔별이 됩니다."
    />
    <!-- 이미지를 바꿀 때는 파일을 덮어쓰지 말고 ?v=2 처럼 번호를 올리세요.
         카카오톡은 썸네일을 약 100일간 캐시합니다. -->
    <meta property="og:image" content="https://janbyeol.com/og-image.png?v=1" />
    <meta property="og:image:secure_url" content="https://janbyeol.com/og-image.png?v=1" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="깊은 밤하늘에 흩어진 잔별들과 '잔별'이라는 글자" />

    <!-- X(트위터) — 큰 카드 -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="잔별 — 사소한 하루가 별이 되어 떠오르는 곳" />
    <meta
      name="twitter:description"
      content="별거 아닌 줄 알았던 당신의 오늘이, 이곳에선 누군가의 밤을 비추는 잔별이 됩니다."
    />
    <meta name="twitter:image" content="https://janbyeol.com/og-image.png?v=1" />

    <!-- 아이콘 / 홈화면 -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="잔별" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@200;300;400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
